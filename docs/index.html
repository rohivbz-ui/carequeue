<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareQueue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#170B33;--ink2:#26154D;--violet:#6B3FD9;--violet-d:#5230B5;--lilac:#EDE7FB;--lilac2:#DCD0F8;--paper:#F6F4FB;--text:#1E1535;--muted:#6A6383;--line:#E3DDF1;--red:#D6334A;--red-bg:#FDECEF;--green:#0E8A66;--green-bg:#E2F5EE;--amber:#9A6200;--amber-bg:#FFF2D6;--blue:#2A5BD7;--blue-bg:#E7EEFC;--gray-bg:#EEECF3;--r:14px;
--fh:'Bricolage Grotesque','Figtree','Noto Sans Tamil','Noto Sans Devanagari',system-ui,sans-serif;
--fb:'Figtree','Noto Sans Tamil','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--text);background:var(--paper);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.mt{margin-top:14px}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--violet);color:#fff;border:1px solid var(--violet);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--violet-d)}
.btn.ghost{background:transparent;color:var(--violet);border-color:var(--lilac2)}
.btn.ghost:hover{background:var(--lilac)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.danger:hover{background:#b92439}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.f{display:grid;gap:14px}
.f label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.err-t{color:var(--red);font-size:14px;min-height:20px}
.linkbtn{background:none;border:0;color:var(--violet);font-weight:600;cursor:pointer;padding:4px 0}
.linkbtn:hover{text-decoration:underline}
.langsel{width:auto;padding:7px 10px;border-radius:9px;font-size:14px}

/* gate */
#gate{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.gate-l{background:var(--ink);color:#fff;padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:700;font-size:21px}
.gate-l h2{font-size:clamp(34px,4.4vw,58px);line-height:1.03;letter-spacing:-.025em;max-width:11em;margin-bottom:16px}
.gate-l p{color:#CDC1EC;max-width:32em;font-size:16px}
.mock{margin-top:34px;width:290px;background:#fff;color:var(--text);border-radius:16px;transform:rotate(-2.5deg);box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.mock .m-top{padding:16px 18px 14px}
.mock small{display:block;color:var(--muted);font-size:12px}
.mock .code{font-family:var(--fh);font-size:30px;font-weight:700;letter-spacing:.01em;margin:2px 0 6px}
.mock .m-bot{display:flex;gap:26px;padding:12px 18px 16px}
.mock .m-bot b{font-family:var(--fh);font-size:22px}
.gate-r{display:flex;flex-direction:column;padding:24px 40px 32px}
.gate-top{display:flex;justify-content:flex-end}
.gate-form{margin:auto;width:100%;max-width:400px;padding:24px 0}
.gate-form h1{font-size:30px;margin-bottom:6px}
.gate-form .lead{color:var(--muted);margin-bottom:20px}
.gate-form .f{margin-bottom:8px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.staff-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px 16px;cursor:pointer}
.staff-entry:hover{background:var(--ink2)}
.staff-entry span{display:block;font-size:13px;color:#BFB1E6;font-weight:400}
.staff-entry strong{display:block}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.roles button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.roles button.on{background:var(--lilac);border-color:var(--violet);color:var(--violet-d);font-weight:600}
.demo-note{background:var(--lilac);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}

/* app shell */
#app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.side{background:var(--ink);color:#D9CFF3;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column}
.side .brand{color:#fff;padding:2px 8px 14px;font-size:19px}
.rolechip{margin:0 8px 8px;font-size:13px;color:#BFB1E6}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-g{font-size:12.5px;color:#9A8CC4;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#D9CFF3;cursor:pointer;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--violet);color:#fff}
.side .out{margin-top:12px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ttl{font-family:var(--fh);font-weight:700;font-size:17px}
.userchip{display:flex;align-items:center;gap:6px;background:var(--lilac);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;max-width:200px}
.userchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none;background:none;border:0;cursor:pointer;padding:4px}
.scrim{display:none}
.main{padding:28px;max-width:1140px}
.staff .side{background:#100622}
.staff .topbar{background:var(--ink2);color:#fff;border-color:transparent}
.staff .userchip{background:rgba(255,255,255,.14)}
.staff .langsel{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.staff .langsel option{color:#000}
.staff .menu-btn{color:#fff}
.staff .main{max-width:1260px}
.staff body,body.staff{background:#F1EEF8}

/* layout bits */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:28px;line-height:1.15}
.sub{color:var(--muted);margin-top:4px}
.sh{font-size:17px;margin:26px 0 10px}
.sh:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.panel h2{font-size:17px;margin-bottom:12px}
.panel>.tw{margin:0 -8px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.hicon{width:44px;height:44px;border-radius:12px;background:var(--lilac);color:var(--violet);display:grid;place-items:center;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--lilac);color:var(--violet-d);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600}
.empty{background:#fff;border:1px dashed var(--lilac2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:14px}
.searchbox input{border:0;padding:11px 4px;outline:0}
.searchbox:focus-within{border-color:var(--violet)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .searchbox{flex:1;min-width:200px;margin:0}
.filters select{width:auto;min-width:160px}
.sosbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--red-bg);border:1px solid #F5C2CB;border-radius:var(--r);padding:14px 18px;margin-bottom:26px}
.sosbar span{display:block;color:#7c2331;font-size:14px}
.quick{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.quick a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500}
.quick a:last-child{border-bottom:0}
.quick a span{flex:1}
.quick a:hover{background:var(--lilac)}
.quick a .ic:first-child{color:var(--violet)}
.alert{border-radius:10px;padding:11px 14px;margin-bottom:16px;font-weight:500}
.alert.err{background:var(--red-bg);color:#8f1f31;border:1px solid #F5C2CB}
.alert.ok{background:var(--green-bg);color:#0a6b4e;border:1px solid #BCE5D6}
.alert.info{background:var(--blue-bg);color:#1f47ad;border:1px solid #C6D6F7}

/* stats, tables, badges */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--fh);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-top:4px}
.stat.alertish b{color:var(--red)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.act{white-space:nowrap}
.tbl td.act .btn{margin-right:4px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.violet{background:var(--lilac);color:var(--violet-d)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.gray{background:var(--gray-bg);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--lilac);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--violet);border-radius:99px}
.bar.low i{background:var(--red)}
.bedrow{display:flex;align-items:center;gap:14px;padding:9px 0}
.bedrow .nm{width:110px;font-weight:500}
.bedrow .bar{flex:1}
.bedrow .ct{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{background:#fff;border:0;width:32px;height:32px;cursor:pointer;font-size:18px}
.stepper button:hover{background:var(--lilac)}
.stepper span{min-width:30px;text-align:center;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--violet-d);border-color:var(--violet)}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--lilac)}
.steps i.done{background:var(--violet)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;margin:0;overflow-wrap:anywhere}

/* ticket */
.ticket{background:#fff;border-radius:18px;border:1px solid var(--line);position:relative;max-width:540px}
.tk-top{padding:22px 24px 18px}
.tk-hosp{color:var(--muted);font-size:14px}
.tk-code{font-family:var(--fh);font-weight:700;font-size:clamp(34px,7vw,46px);letter-spacing:.01em;line-height:1.1;margin:4px 0 10px}
.tk-line{margin-top:12px;font-weight:600}
.perf{position:relative;border-top:2px dashed var(--lilac2)}
.perf:before,.perf:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.perf:before{left:-11px;clip-path:inset(0 0 0 50%)}
.perf:after{right:-11px;clip-path:inset(0 50% 0 0)}
.staff .perf:before,.staff .perf:after{background:#F1EEF8}
.tk-bot{display:flex;gap:22px;padding:20px 24px 24px;flex-wrap:wrap;align-items:flex-start}
.qrbox{width:176px;height:176px;flex:none;display:grid;place-items:center}
.qrbox img,.qrbox canvas{max-width:100%}
.qrfallback{font-size:13px;color:var(--muted);text-align:center;border:1px dashed var(--lilac2);border-radius:10px;padding:12px}
.tk-bot .kv{flex:1;min-width:220px}

/* misc */
.order{padding:16px 0;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}
.sosbtn{width:190px;height:190px;border-radius:50%;background:var(--red);color:#fff;border:0;font-family:var(--fh);font-size:40px;font-weight:700;cursor:pointer;box-shadow:0 0 0 14px var(--red-bg),0 0 0 15px #F5C2CB;margin:18px auto 34px;display:block}
.sosbtn:hover{background:#b92439}
#reader{width:100%;max-width:420px;min-height:250px;border-radius:14px;overflow:hidden;background:var(--ink);color:#CDC1EC;display:grid;place-items:center;text-align:center;padding:16px}
#reader video{max-width:100%}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;border-radius:11px;padding:12px 16px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .18s ease-out}
.toast.error{background:var(--red)}
.toast.warn{background:#8a5a00}
.toast.ok{background:var(--ink)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
 #gate{grid-template-columns:1fr}
 .gate-l{padding:26px 22px 30px;gap:22px}
 .mock{display:none}
 .gate-r{padding:18px 20px 28px}
 #app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-102%);transition:transform .2s}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(23,11,51,.5);z-index:45}
 .menu-btn{display:inline-flex}
 .topbar{padding:10px 16px}
 .main{padding:20px 16px}
 .cols,.cols.even{grid-template-columns:1fr}
 .userchip{display:none}
}
@media (max-width:520px){
 .pagehead h1{font-size:24px}
 .btns .btn{flex:1}
 .inline{flex-direction:column}
 .li .btns{width:100%}
 .tk-bot{justify-content:center}
}
</style>
</head>
<body>

<!-- ===== AUTH GATE ===== -->
<div id="gate">
  <section class="gate-l">
    <div class="brand"><span class="logo"></span>CareQueue</div>
    <div>
      <h2 data-i18n="hero_h"></h2>
      <p data-i18n="app_tag"></p>
      <div class="mock" aria-hidden="true">
        <div class="m-top"><small>CityCare Multispecialty Hospital</small><div class="code">CITY-CAR-014</div><span class="badge violet" data-i18n="st_In Queue"></span></div>
        <div class="perf"></div>
        <div class="m-bot"><div><small data-i18n="position"></small><b>3</b></div><div><small data-i18n="est_wait"></small><b>24 <span data-i18n="min" style="font-size:14px;font-weight:500"></span></b></div></div>
      </div>
    </div>
    <div></div>
  </section>

  <section class="gate-r">
    <div class="gate-top"><select class="langsel" id="langGate" aria-label="Language" onchange="setLang(this.value)"></select></div>

    <!-- Patient login (only role on this screen) -->
    <div class="gate-form" id="gPatient">
      <h1 id="pTitle"></h1>
      <p class="lead" data-i18n="patient_lead"></p>
      <div class="f">
        <div id="regFields" class="f hidden">
          <label><span data-i18n="fullname"></span><input id="pName" autocomplete="name"></label>
          <label><span data-i18n="phone"></span><input id="pPhone" inputmode="tel" autocomplete="tel"></label>
        </div>
        <label><span data-i18n="email"></span><input id="pEmail" type="email" autocomplete="email"></label>
        <label><span data-i18n="password"></span><input id="pPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')patientAuth()"></label>
        <div class="err-t" id="pErr" role="alert"></div>
        <button class="btn block" id="pSubmit" onclick="patientAuth()"></button>
      </div>
      <div class="btns" style="justify-content:space-between;margin-top:6px">
        <button class="linkbtn" id="pSwitch" onclick="setGateMode(gateMode==='login'?'register':'login')"></button>
        <button class="linkbtn" id="demoBtn" onclick="demoPatient()" data-i18n="demo_patient"></button>
      </div>
      <div class="divider"><span data-i18n="or"></span></div>
      <button class="staff-entry" onclick="openStaffPortal()">
        <span class="ico"></span>
        <div><strong data-i18n="staff_portal"></strong><span data-i18n="staff_hint"></span></div>
      </button>
    </div>

    <!-- Hospital staff portal login (separate screen) -->
    <div class="gate-form hidden" id="gStaff">
      <h1 id="sTitle"></h1>
      <p class="lead" id="sRole"></p>
      <div class="f">
        <label><span id="sIdLabel"></span><input id="sId" autocomplete="username" autocapitalize="characters"></label>
        <label><span data-i18n="password"></span><input id="sPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')staffAuth()"></label>
        <div class="err-t" id="sErr" role="alert"></div>
        <button class="btn block" onclick="staffAuth()" data-i18n="login"></button>
        <button class="btn ghost block" onclick="backToPatient()" data-i18n="back_patient"></button>
      </div>
      <div class="demo-note mt"><span id="sDemo"></span><button class="linkbtn" onclick="fillDemoStaff()" data-i18n="fill"></button></div>
      <div class="divider"><span data-i18n="partner_access"></span></div>
      <div class="roles" id="roleBtns">
        <button data-role="hospital" onclick="setStaffRole('hospital')" data-i18n="r_hospital"></button>
        <button data-role="admin" onclick="setStaffRole('admin')" data-i18n="r_admin"></button>
        <button data-role="delivery" onclick="setStaffRole('delivery')" data-i18n="r_delivery"></button>
        <button data-role="ambulance" onclick="setStaffRole('ambulance')" data-i18n="r_ambulance"></button>
      </div>
    </div>
  </section>
</div>

<!-- ===== APPLICATION SHELL ===== -->
<div id="app" class="hidden">
  <div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>
  <aside class="side" id="side">
    <div class="brand"><span class="logo"></span>CareQueue</div>
    <div class="rolechip" id="roleChip"></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav out"><a onclick="logout()" id="logoutLink"></a></div>
  </aside>
  <div style="min-width:0">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" onclick="toggleMenu(true)" aria-label="Menu"></button>
      <div class="ttl" id="pageTitle"></div>
      <div class="grow"></div>
      <select class="langsel" id="langApp" aria-label="Language" onchange="setLang(this.value)"></select>
      <div class="userchip" id="userChip"></div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

function patientAuth(){
  loadDB();
  const email=$('#pEmail').value.trim().toLowerCase(),pw=$('#pPw').value,err=$('#pErr');
  if(gateMode==='register'){
    const name=$('#pName').value.trim(),phone=$('#pPhone').value.trim();
    if(!name||!phone||!email||!pw){err.textContent=t('fill_all');return}
    if(DB.users.some(u=>u.email===email)){err.textContent=t('email_used');return}
    const u={id:uid('u_'),name,email,phone,password:pw};DB.users.push(u);saveDB();
    return startSession('patient',u.id,u.name);
  }
  const u=DB.users.find(x=>x.email===email&&x.password===pw);
  if(!u){err.textContent=t('invalid_login');return}
  startSession('patient',u.id,u.name);
}
function demoPatient(){loadDB();const u=DB.users[0];startSession('patient',u.id,u.name)}
function staffAuth(){
  loadDB();
  const id=$('#sId').value.trim().toUpperCase(),pw=$('#sPw').value,err=$('#sErr');
  if(!id||!pw){err.textContent=t('fill_all');return}
  if(staffRole==='hospital'){
    const h=DB.hospitals.find(x=>x.id===id);
    if(h&&pw==='admin123')return startSession('hospital',h.id,h.name);
  }else{
    const s=STAFF[staffRole];
    if(s&&id===s.id&&pw===s.pw)return startSession(staffRole,s.id,s.name);
  }
  err.textContent=t('invalid_login');
}

function go(page,params){
  if(!S||!S.loggedIn){lockApp();return false}

let tkSel={hid:'',dept:'',doc:''};
function tokChange(f,v){tkSel[f]=v;if(f==='hid'){tkSel.dept='';tkSel.doc=''}if(f==='dept')tkSel.doc='';renderCurrent()}
function vToken(){
  const hs=DB.hospitals.filter(h=>h.active);
  if(ctx.hid){tkSel={hid:ctx.hid,dept:'',doc:''};ctx.hid=null}

  const h=hosp(tkSel.hid);

  const d=deptOf(h.id,tkSel.dept),docs=h.doctors.filter(x=>x.dept===tkSel.dept&&x.available);
  if(!docs.some(x=>x.id===tkSel.doc))tkSel.doc='';

   '<label>'+t('hospital')+'<select onchange="tokChange(\'hid\',this.value)">'+opts(hs.map(x=>[x.id,x.name]),h.id)+'</select></label>'+
   '<label>'+t('dept')+'<select onchange="tokChange(\'dept\',this.value)">'+opts(h.depts.map(x=>x.n),d.n)+'</select></label>'+
   '<label>'+t('doctor')+'<select onchange="tokChange(\'doc\',this.value)"><option value="">'+t('any_doctor')+'</option>'+opts(docs.map(x=>[x.id,x.name]),tkSel.doc)+'</select></label>'+

   '<div class="panel"><h2>'+t('if_join')+'</h2><dl class="kv"><dt>'+t('position')+'</dt><dd>'+(n+1)+'</dd><dt>'+t('est_wait')+'</dt><dd>'+t('about_min',{n:(n+1)*d.avg})+'</dd><dt>'+t('room')+'</dt><dd>'+esc(d.room)+'</dd></dl></div></div>';

function createToken(){
  if(!S||S.role!=='patient'){toast(t('token_only_patient'),'error');return}   /* server-style guard inside the action too */
  loadDB();
  const h=hosp(tkSel.hid);if(!h||!h.active||!tkSel.dept)return;
  const ex=DB.tokens.find(x=>x.uid===S.id&&x.hid===h.id&&x.dept===tkSel.dept&&x.date===TODAY()&&ACTIVE.includes(x.status));
  if(ex){toast(t('token_exists'),'warn');go('myToken',{id:ex.id});return}
  const k=mkToken(DB,{hid:h.id,dept:tkSel.dept,doc:tkSel.doc,uid:S.id,name:S.name,status:'Waiting'});
  saveDB();toast(t('token_created'));go('myToken',{id:k.id});
}

/* medicines */
const ORDER_FLOW=['Order Placed','Preparing','Packed','Out for Delivery','Delivered'];

function cartAdd(id,d){const n=Math.max(0,(med.cart[id]||0)+d);if(n)med.cart[id]=n;else delete med.cart[id];renderCurrent()}

  if(med.tab==='cart'){

    body=!items.length?empty(t('cart_empty'),'<div><button class="btn" onclick="med.tab=\'shop\';renderCurrent()">'+t('browse_meds')+'</button></div>'):
     '<div class="cols"><div class="list">'+items.map(({m,n})=>'<div class="li"><div class="grow"><strong>'+esc(m.name)+'</strong><div class="muted">'+esc(m.form)+'</div></div><div class="price">₹'+m.price*n+'</div><div class="stepper"><button onclick="cartAdd(\''+m.id+'\',-1)">−</button><span>'+n+'</span><button onclick="cartAdd(\''+m.id+'\',1)">+</button></div></div>').join('')+
     '<div class="li"><div class="grow"><strong>'+t('total')+'</strong></div><div class="price">₹'+cartTotal()+'</div></div></div>'+

  if(!needRole('patient'))return;loadDB();

function resultHTML(){

  const r=lastScan,x=r.id&&DB.tokens.find(k=>k.id===r.id&&k.hid===S.id);

     '<div class="btns mt">'+(x.status==='Verified'?'<button class="btn" onclick="tokAct(\''+x.id+'\',\'queue\')">'+t('act_queue')+'</button>':'')+(x.status==='In Queue'?'<button class="btn" onclick="tokAct(\''+x.id+'\',\'call\')">'+t('act_call')+'</button>':'')+'</div>';
  }
  return h;
}
function showScanResult(){const el=$('#scanResult');if(el)el.innerHTML=resultHTML()}
function verifyInput(raw){
  if(!needRole('hospital'))return;loadDB();
  let code=String(raw||'').trim();
  try{const p=JSON.parse(code);if(p&&p.code)code=p.code}catch(e){}
  code=code.toUpperCase();
  if(!code)return toast(t('fill_all'),'warn');
  const x=DB.tokens.find(k=>k.code.toUpperCase()===code);
  if(!x)lastScan={ok:false,msg:'token_not_found'};
  else if(x.hid!==S.id)lastScan={ok:false,msg:'token_other_hospital'};
  else if(x.date!==TODAY())lastScan={ok:false,msg:'token_old',id:x.id};
  else if(x.status==='Cancelled'||x.status==='Completed')lastScan={ok:false,msg:'token_closed',id:x.id};
  else if(x.status==='Waiting'){x.status='Verified';saveDB();lastScan={ok:true,msg:'token_verified',id:x.id}}
  else lastScan={ok:true,msg:'token_already',id:x.id};
  showScanResult();toast(t(lastScan.msg),lastScan.ok?'ok':'error');
}
function manualVerify(){verifyInput(($('#manIn')||{}).value)}
async function stopScan(){
  const s=scanner;scanner=null;
  if(s){try{await s.stop();s.clear()}catch(e){}}
  const b=$('#scanBtn');if(b)b.innerHTML=ic('qr')+' '+t('start_scan');
  const r=$('#reader');if(r&&!r.children.length)r.innerHTML='<span>'+esc(t('camera_off'))+'</span>';
}
async function toggleScan(){
  if(!needRole('hospital'))return;
  if(scanner){await stopScan();return}
  const r=$('#reader');
  if(!window.Html5Qrcode||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){r.innerHTML='<span>'+esc(t('camera_unavailable'))+'</span>';toast(t('camera_unavailable'),'warn');return}
  try{
    r.innerHTML='';scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},txt=>{verifyInput(txt);stopScan()},()=>{});
    $('#scanBtn').innerHTML=ic('x',18)+' '+t('stop_scan');
  }catch(e){scanner=null;r.innerHTML='<span>'+esc(t('camera_unavailable'))+'</span>';toast(t('camera_unavailable'),'warn')}
}

function vAdminService(){

  return head(t('n_services'),t('services_sub'))+
  '<div class="panel"><h2>'+t('n_homecare')+'</h2>'+(hc.length?'<div class="tw"><table class="tbl"><thead><tr><th>'+t('patient')+'</th><th>'+t('n_homecare')+'</th><th>'+t('date')+'</th><th>'+t('status')+'</th><th></th></tr></thead><tbody>'+hc.map(h=>'<tr><td>'+esc(h.name)+'</td><td>'+esc(h.service)+'</td><td>'+fmtDate(h.date)+'</td><td>'+badge(h.status)+'</td><td class="act">'+(h.status==='Requested'?'<button class="btn sm" onclick="hcAct(\''+h.id+'\',\'Assigned\')">'+t('assign')+'</button>':'')+(h.status==='Assigned'?'<button class="btn sm" onclick="hcAct(\''+h.id+'\',\'Completed\')">'+t('act_complete')+'</button>':'')+'</td></tr>').join('')+'</tbody></table></div>':empty(t('no_requests')))+'</div>'+
  '<div class="panel"><h2>'+t('orders')+'</h2>'+(DB.orders.length?'<div class="tw"><table class="tbl"><thead><tr><th>#</th><th>'+t('patient')+'</th><th>'+t('total')+'</th><th>'+t('status')+'</th></tr></thead><tbody>'+DB.orders.slice().reverse().map(o=>'<tr><td>'+esc(o.id.slice(-5).toUpperCase())+'</td><td>'+esc(o.name)+'</td><td>₹'+o.total+'</td><td>'+badge(o.status)+'</td></tr>').join('')+'</tbody></table></div>':empty(t('no_orders')))+'</div>';
}
function hcAct(id,st){if(!needRole('admin'))return;loadDB();const h=DB.homecare.find(x=>x.id===id);if(h){h.status=st;saveDB();renderCurrent()}}

const DELIVERY_NEXT={'Order Placed':['Preparing','act_prep'],'Preparing':['Packed','act_pack'],'Packed':['Out for Delivery','act_out'],'Out for Delivery':['Delivered','act_deliver']};
function vDelivery(){
  const o=DB.orders.slice().sort((a,b)=>a.createdAt-b.createdAt),open=o.filter(x=>x.status!=='Delivered');
  return head(t('n_deliveries'),t('delivery_sub'))+
  '<div class="stats">'+stat(o.filter(x=>x.status==='Order Placed'||x.status==='Preparing').length,'k_to_prepare','pill')+stat(o.filter(x=>x.status==='Packed'||x.status==='Out for Delivery').length,'k_on_way','truck')+stat(o.filter(x=>x.status==='Delivered').length,'st_Delivered','check')+'</div>'+
  (open.length?'<div class="list" style="padding-top:2px;padding-bottom:2px">'+open.map(x=>'<div class="order"><div class="btns" style="justify-content:space-between;align-items:center"><strong>#'+esc(x.id.slice(-5).toUpperCase())+', '+esc(x.name)+'</strong>'+badge(x.status)+'</div><div class="muted">'+x.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')+'</div><div class="muted">'+esc(x.address)+', '+esc(x.phone)+'</div><div class="steps" aria-hidden="true">'+ORDER_FLOW.map((s,j)=>'<i class="'+(j<=ORDER_FLOW.indexOf(x.status)?'done':'')+'"></i>').join('')+'</div><button class="btn sm mt" onclick="orderAdvance(\''+x.id+'\')">'+t(DELIVERY_NEXT[x.status][1])+'</button></div>').join('')+'</div>':empty(t('no_open_orders')));
}
function orderAdvance(id){if(!needRole('delivery'))return;loadDB();const o=DB.orders.find(x=>x.id===id);if(o&&DELIVERY_NEXT[o.status]){o.status=DELIVERY_NEXT[o.status][0];saveDB();toast(t('updated'));renderCurrent()}}

function vAmbPortal(){
  const rq=DB.ambReqs.slice().sort((a,b)=>(a.type==='Emergency'?0:1)-(b.type==='Emergency'?0:1)||b.createdAt-a.createdAt);
  const btn=(id,st,l)=>'<button class="btn sm" onclick="ambAct(\''+id+'\',\''+st+'\')">'+t(l)+'</button>';
  return head(t('n_requests'),t('amb_portal_sub'))+'<div class="cols"><div><h2 class="sh">'+t('n_requests')+'</h2>'+(rq.length?'<div class="list">'+rq.map(a=>'<div class="li"><div class="grow"><strong>'+esc(t(a.type==='Emergency'?'amb_emergency':'amb_transfer'))+', '+esc(a.name)+'</strong><div class="muted">'+esc(a.pickup)+'</div><div class="muted">'+esc(a.phone)+', '+esc((hosp(a.hid)||{}).name||'')+(a.amb?', '+esc(a.amb):'')+'</div></div>'+badge(a.status)+(a.status==='Requested'?btn(a.id,'Dispatched','act_dispatch'):'')+(a.status==='Dispatched'?btn(a.id,'Arrived','act_arrived'):'')+(a.status==='Arrived'?btn(a.id,'Completed','act_complete'):'')+'</div>').join('')+'</div>':empty(t('no_amb_req')))+'</div>'+
  '<div><h2 class="sh">'+t('fleet')+'</h2><div class="panel">'+DB.ambulances.map(a=>'<div class="bedrow"><span class="grow"><strong>'+esc(a.id)+'</strong> <span class="muted">'+esc(a.driver)+'</span></span>'+badge(a.status)+'</div>').join('')+'</div></div></div>';
}
function ambAct(id,st){
  if(!needRole('ambulance'))return;loadDB();
  const r=DB.ambReqs.find(x=>x.id===id);if(!r)return;
  if(st==='Dispatched'){
    const v=DB.ambulances.find(a=>a.status==='Available');
    if(!v)return toast(t('no_amb_free'),'warn');
    v.status='Busy';r.amb=v.id;
  }
  if(st==='Completed'){const v=DB.ambulances.find(a=>a.id===r.amb);if(v)v.status='Available'}
  r.status=st;saveDB();toast(t('updated'));renderCurrent();
}

/* ---------- boot ---------- */
function init(){
  loadDB();
  const langOpts='<option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option>';
  ['langGate','langApp'].forEach(i=>{$('#'+i).innerHTML=langOpts;$('#'+i).value=lang});
  document.documentElement.lang=lang;
  document.querySelectorAll('.logo').forEach(e=>{e.innerHTML=LOGO});
  S=getSession();
  if(S&&S.loggedIn&&ROLE_HOME[S.role]&&(S.role!=='hospital'||hosp(S.id))){
    unlockApp();
    const p=location.hash.replace(/^#\/?/,'');
    go(p&&ROUTES[p]?p:ROLE_HOME[S.role]);
  }else{S=null;lockApp()}
}
init();
</script>
</body>
